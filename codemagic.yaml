# Codemagic: build Codevia Pocket for iOS and upload it to TestFlight.
# Signing is automatic: the App Store Connect integration creates/fetches the distribution
# certificate and App Store profile; CERTIFICATE_PRIVATE_KEY (secure group "codevia_signing")
# is the RSA key that certificate is bound to.
workflows:
  ios-testflight:
    name: Codevia Pocket → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      groups:
        - codevia_signing
      ios_signing:
        # Loads the team's Apple Distribution identity (with private key) from Codemagic
        # Code signing identities. Codemagic requires a stored profile alongside it, so an existing
        # team profile is referenced; it is not used for this app. Our own App Store profile
        # ("Codevia Pocket App Store", created by ios-signing-bootstrap) is downloaded below.
        certificates:
          - monetniy-mir-distribution
        provisioning_profiles:
          - mayor-city-app-store
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: com.codevia.pocket
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        TEAM_ID: 8PMNK7YN6D
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Toolchain
        script: |
          xcodebuild -version
          node --version
          xcode_major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$xcode_major" -lt 26 ]; then echo "Capacitor 8 needs Xcode 26+"; exit 1; fi
      - name: Install dependencies
        script: npm ci
      - name: Unit tests
        script: npm test
      - name: Build web app and sync iOS project
        script: |
          npm run build
          npx cap sync ios
      - name: Set build number
        script: |
          # Codemagic's BUILD_NUMBER grows with every build of this app, so uploads never collide.
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9.]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" "$XCODE_PROJECT/project.pbxproj"
          grep -m1 "CURRENT_PROJECT_VERSION" "$XCODE_PROJECT/project.pbxproj"
          grep -m1 "MARKETING_VERSION" "$XCODE_PROJECT/project.pbxproj"
      - name: App Store profile for com.codevia.pocket
        script: |
          set -euo pipefail
          # Download this app's App Store profile (bound to all team distribution certificates).
          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --platform IOS --strict-match-identifier --json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          app-store-connect bundle-ids profiles --bundle-ids "$BID" --type IOS_APP_STORE --state ACTIVE --save
          security find-identity -v -p codesigning || true
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release
          ls -la build/ios/ipa
          unzip -q -o build/ios/ipa/*.ipa -d /tmp/ipa
          codesign -dvv /tmp/ipa/Payload/App.app 2>&1 | grep -E "Authority=Apple Distribution|TeamIdentifier" || true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only: the build appears in TestFlight for internal testers. External testing
        # (Beta App Review) needs test information filled in App Store Connect first.
        submit_to_testflight: false

  # One-off: creates the App Store provisioning profile for com.codevia.pocket. It includes every
  # active distribution certificate of the team, so it matches whichever identity Codemagic loads
  # (monetniy-mir-distribution). Safe to re-run: it does nothing if an active profile exists.
  ios-signing-bootstrap:
    name: Codevia Pocket — create App Store profile
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      vars:
        BUNDLE_ID: com.codevia.pocket
    scripts:
      - name: Create App Store profile
        script: |
          set -euo pipefail
          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --platform IOS --strict-match-identifier --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['id'])")
          echo "Bundle ID resource: $BID"
          app-store-connect certificates list --type DISTRIBUTION IOS_DISTRIBUTION --json > /tmp/certs.json
          python3 - <<'PY'
          import json
          for c in json.load(open('/tmp/certs.json')):
              a = c['attributes']
              print(f"certificate {c['id']}: {a.get('name')} | {a.get('displayName')} | expires {a.get('expirationDate')} | serial {a.get('serialNumber')}")
          PY
          CERT_IDS=$(python3 -c "import json; print(' '.join(c['id'] for c in json.load(open('/tmp/certs.json'))))")
          # Profiles that contained a revoked certificate become INVALID: delete them first.
          app-store-connect bundle-ids profiles --bundle-ids "$BID" --type IOS_APP_STORE --state INVALID --json 2>/dev/null \
            | python3 -c "import json,sys; [print(p['id']) for p in json.load(sys.stdin)]" \
            | while read -r pid; do echo "Deleting invalid profile $pid"; app-store-connect profiles delete "$pid"; done || true
          ACTIVE=$(app-store-connect bundle-ids profiles --bundle-ids "$BID" --json 2>/dev/null \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for p in d if p['attributes'].get('profileType')=='IOS_APP_STORE' and p['attributes'].get('profileState')=='ACTIVE'))" || echo 0)
          echo "Active App Store profiles: $ACTIVE"
          if [ "$ACTIVE" = "0" ]; then
            app-store-connect profiles create "$BID" --type IOS_APP_STORE --certificate-ids $CERT_IDS \
              --name "Codevia Pocket App Store"
          fi
          app-store-connect bundle-ids profiles --bundle-ids "$BID" --type IOS_APP_STORE

  # Read-only: shows the processing state of uploaded builds in App Store Connect / TestFlight.
  testflight-status:
    name: Codevia Pocket — TestFlight status
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: monetniy-mir-asc
    scripts:
      - name: TestFlight builds
        script: |
          set -euo pipefail
          APP_ID=$(app-store-connect apps list --bundle-id-identifier com.codevia.pocket --strict-match-identifier --json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          echo "App Store Connect app id: $APP_ID"
          app-store-connect builds list --app-id "$APP_ID" --json > /tmp/builds.json
          python3 - <<'PY'
          import json
          for b in json.load(open('/tmp/builds.json')):
              a = b['attributes']
              print(f"build {a.get('version')} | processing={a.get('processingState')} | uploaded={a.get('uploadedDate')} | expired={a.get('expired')} | encryption={a.get('usesNonExemptEncryption')}")
          PY

  # App Store listing: texts, categories, age rating, price, availability, screenshots, build,
  # review notes (tools/asc_submit.py + appstore/metadata.json). Does not submit.
  app-store-metadata:
    name: Codevia Pocket — App Store metadata
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: monetniy-mir-asc
    scripts:
      - name: Apply metadata
        script: |
          python3 -c "import cryptography" 2>/dev/null || pip3 install --quiet cryptography
          python3 tools/asc_submit.py appstore/metadata.json

  # Same as above, then sends the version to App Review. Needs the secure group "review_contact"
  # (REVIEW_FIRST_NAME, REVIEW_LAST_NAME, REVIEW_PHONE, REVIEW_EMAIL).
  app-store-submit:
    name: Codevia Pocket — submit for App Review
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      groups:
        - review_contact
    scripts:
      - name: Apply metadata and submit
        script: |
          python3 -c "import cryptography" 2>/dev/null || pip3 install --quiet cryptography
          python3 tools/asc_submit.py appstore/metadata.json --submit
