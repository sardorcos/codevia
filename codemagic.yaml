# Codemagic: build Codevia Pocket for iOS and upload it to TestFlight.
# Signing is automatic: the App Store Connect integration creates/fetches the distribution
# certificate and App Store profile; CERTIFICATE_PRIVATE_KEY (secure group "codevia_signing")
# is the RSA key that certificate is bound to.
workflows:
  ios-testflight:
    name: Codevia Pocket → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      groups:
        - codevia_signing
      ios_signing:
        # Loads the team's Apple Distribution identity (with private key) from Codemagic
        # Code signing identities. Codemagic requires a stored profile alongside it, so an existing
        # team profile is referenced; it is not used for this app. Our own App Store profile
        # ("Codevia Pocket App Store", created by ios-signing-bootstrap) is downloaded below.
        certificates:
          - monetniy-mir-distribution
        provisioning_profiles:
          - mayor-city-app-store
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: com.codevia.pocket
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        TEAM_ID: 8PMNK7YN6D
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Toolchain
        script: |
          xcodebuild -version
          node --version
          xcode_major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$xcode_major" -lt 26 ]; then echo "Capacitor 8 needs Xcode 26+"; exit 1; fi
      - name: Install dependencies
        script: npm ci
      - name: Unit tests
        script: npm test
      - name: Build web app and sync iOS project
        script: |
          # Release builds must contain the bundled Python packages (numpy, pandas, matplotlib…).
          CODEVIA_PY_STRICT=1 npm run build
          du -sh public/pyodide
          npx cap sync ios
      - name: Set build number
        script: |
          # Codemagic's BUILD_NUMBER grows with every build of this app, so uploads never collide.
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9.]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" "$XCODE_PROJECT/project.pbxproj"
          grep -m1 "CURRENT_PROJECT_VERSION" "$XCODE_PROJECT/project.pbxproj"
          grep -m1 "MARKETING_VERSION" "$XCODE_PROJECT/project.pbxproj"
      - name: App Store profile for com.codevia.pocket
        script: |
          set -euo pipefail
          # Download this app's App Store profile (bound to all team distribution certificates).
          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --platform IOS --strict-match-identifier --json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          app-store-connect bundle-ids profiles --bundle-ids "$BID" --type IOS_APP_STORE --state ACTIVE --save
          security find-identity -v -p codesigning || true
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release
          ls -la build/ios/ipa
          unzip -q -o build/ios/ipa/*.ipa -d /tmp/ipa
          codesign -dvv /tmp/ipa/Payload/App.app 2>&1 | grep -E "Authority=Apple Distribution|TeamIdentifier" || true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only: the build appears in TestFlight for internal testers. External testing
        # (Beta App Review) needs test information filled in App Store Connect first.
        submit_to_testflight: false

  # One-off: creates the App Store provisioning profile for com.codevia.pocket. It includes every
  # active distribution certificate of the team, so it matches whichever identity Codemagic loads
  # (monetniy-mir-distribution). Safe to re-run: it does nothing if an active profile exists.
  ios-signing-bootstrap:
    name: Codevia Pocket — create App Store profile
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      vars:
        BUNDLE_ID: com.codevia.pocket
    scripts:
      - name: Create App Store profile
        script: |
          set -euo pipefail
          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --platform IOS --strict-match-identifier --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['id'])")
          echo "Bundle ID resource: $BID"
          app-store-connect certificates list --type DISTRIBUTION IOS_DISTRIBUTION --json > /tmp/certs.json
          python3 - <<'PY'
          import json
          for c in json.load(open('/tmp/certs.json')):
              a = c['attributes']
              print(f"certificate {c['id']}: {a.get('name')} | {a.get('displayName')} | expires {a.get('expirationDate')} | serial {a.get('serialNumber')}")
          PY
          CERT_IDS=$(python3 -c "import json; print(' '.join(c['id'] for c in json.load(open('/tmp/certs.json'))))")
          # Profiles that contained a revoked certificate become INVALID: delete them first.
          app-store-connect bundle-ids profiles --bundle-ids "$BID" --type IOS_APP_STORE --state INVALID --json 2>/dev/null \
            | python3 -c "import json,sys; [print(p['id']) for p in json.load(sys.stdin)]" \
            | while read -r pid; do echo "Deleting invalid profile $pid"; app-store-connect profiles delete "$pid"; done || true
          ACTIVE=$(app-store-connect bundle-ids profiles --bundle-ids "$BID" --json 2>/dev/null \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for p in d if p['attributes'].get('profileType')=='IOS_APP_STORE' and p['attributes'].get('profileState')=='ACTIVE'))" || echo 0)
          echo "Active App Store profiles: $ACTIVE"
          if [ "$ACTIVE" = "0" ]; then
            app-store-connect profiles create "$BID" --type IOS_APP_STORE --certificate-ids $CERT_IDS \
              --name "Codevia Pocket App Store"
          fi
          app-store-connect bundle-ids profiles --bundle-ids "$BID" --type IOS_APP_STORE

  # Read-only: shows the processing state of uploaded builds in App Store Connect / TestFlight.
  # Checks the public GitHub App used for "Sign in with GitHub" (device flow): app page by slug and
  # whether the device flow is enabled. Prints no codes or secrets.
  github-app-check:
    name: Codevia Pocket — GitHub App check
    instance_type: linux_x2
    max_build_duration: 5
    environment:
      vars:
        GITHUB_CLIENT_ID: Iv23liJ0NdoHBNIReM0a
    scripts:
      - name: GitHub App
        script: |
          set -u
          for slug in codevia-pocket codevia-pocket-app; do
            curl -s -H 'Accept: application/vnd.github+json' "https://api.github.com/apps/$slug" > app.json
            python3 - "$slug" <<'PY'
          import json, os, sys
          d = json.load(open('app.json'))
          if d.get('client_id'):
              print(f"slug={sys.argv[1]} client_id={d['client_id']} match={d['client_id'] == os.environ['GITHUB_CLIENT_ID']} owner={d['owner']['login']}")
              print('permissions', d.get('permissions'), 'events', d.get('events'))
          else:
              print(f"slug={sys.argv[1]}: {d.get('message')}")
          PY
          done
          curl -s -X POST -H 'Accept: application/json' -d "client_id=$GITHUB_CLIENT_ID&scope=" https://github.com/login/device/code > dev.json
          python3 -c "import json; d=json.load(open('dev.json')); print('device flow:', 'ENABLED' if 'device_code' in d else d)"

  testflight-status:
    name: Codevia Pocket — TestFlight status
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: monetniy-mir-asc
    scripts:
      - name: TestFlight builds
        script: |
          set -euo pipefail
          APP_ID=$(app-store-connect apps list --bundle-id-identifier com.codevia.pocket --strict-match-identifier --json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          echo "App Store Connect app id: $APP_ID"
          app-store-connect builds list --app-id "$APP_ID" --json > /tmp/builds.json
          python3 - <<'PY'
          import json
          for b in json.load(open('/tmp/builds.json')):
              a = b['attributes']
              print(f"build {a.get('version')} | processing={a.get('processingState')} | uploaded={a.get('uploadedDate')} | expired={a.get('expired')} | encryption={a.get('usesNonExemptEncryption')}")
          PY

  # Read-only: App Store versions, their states and review submissions.
  app-store-status:
    name: Codevia Pocket — App Store status
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: monetniy-mir-asc
    scripts:
      - name: App Store status
        script: |
          python3 -c "import cryptography" 2>/dev/null || pip3 install --quiet cryptography
          python3 tools/asc_submit.py appstore/metadata.json --status

  # App Store listing: texts, categories, age rating, price, availability, screenshots, build,
  # review notes (tools/asc_submit.py + appstore/metadata.json). Does not submit.
  app-store-metadata:
    name: Codevia Pocket — App Store metadata
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      groups:
        - review_contact
    scripts:
      - name: Apply metadata
        script: |
          python3 -c "import cryptography" 2>/dev/null || pip3 install --quiet cryptography
          python3 tools/asc_submit.py appstore/metadata.json

  # Same as above, then sends the version to App Review. Needs the secure group "review_contact"
  # (REVIEW_FIRST_NAME, REVIEW_LAST_NAME, REVIEW_PHONE, REVIEW_EMAIL).
  app-store-submit:
    name: Codevia Pocket — submit for App Review
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      groups:
        - review_contact
    scripts:
      - name: Apply metadata and submit
        script: |
          python3 -c "import cryptography" 2>/dev/null || pip3 install --quiet cryptography
          python3 tools/asc_submit.py appstore/metadata.json --submit

  # ModelLink (modellink/): read-only look at App Store Connect apps and bundle IDs of the team.
  modellink-asc-discovery:
    name: ModelLink — App Store Connect discovery
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: monetniy-mir-asc
    scripts:
      - name: Apps and bundle IDs
        script: |
          set -euo pipefail
          app-store-connect apps list --json > /tmp/apps.json
          python3 - <<'PY'
          import json
          for a in json.load(open('/tmp/apps.json')):
              at = a['attributes']
              print(f"app {a['id']} | {at.get('name')} | {at.get('bundleId')} | sku={at.get('sku')} | lang={at.get('primaryLocale')}")
          PY
          app-store-connect bundle-ids list --platform IOS --json > /tmp/bids.json
          python3 - <<'PY'
          import json
          for b in json.load(open('/tmp/bids.json')):
              at = b['attributes']
              print(f"bundle {b['id']} | {at.get('identifier')} | {at.get('name')} | seed={at.get('seedId')}")
          PY

  # ModelLink (modellink/): web app in Capacitor 8 + native document plugin → TestFlight.
  modellink-testflight:
    name: ModelLink → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: modellink
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      groups:
        - codevia_signing
      ios_signing:
        # Team Apple Distribution identity (see ios-testflight above). The referenced profile
        # belongs to another app; ModelLink's own App Store profile is fetched/created below.
        certificates:
          - monetniy-mir-distribution
        provisioning_profiles:
          - mayor-city-app-store
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: com.neverlandplayworks.modellink
        APP_NAME: ModelLink
        APP_SKU: modellink-ios
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Toolchain
        script: |
          xcodebuild -version
          node --version
          xcode_major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$xcode_major" -lt 26 ]; then echo "Capacitor 8 needs Xcode 26+"; exit 1; fi
      - name: App Store Connect bundle ID and app record
        script: |
          python3 -c "import cryptography" 2>/dev/null || pip3 install --quiet cryptography
          python3 tools/asc_setup.py "$BUNDLE_ID" "$APP_NAME" "$APP_SKU"
      - name: Install dependencies and test
        script: |
          npm ci
          npm run check
      - name: Build web app and sync iOS project
        script: |
          npm run build
          npx cap sync ios
      - name: Set build number
        script: |
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9.]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" "$XCODE_PROJECT/project.pbxproj"
          grep -m1 "CURRENT_PROJECT_VERSION" "$XCODE_PROJECT/project.pbxproj"
          grep -m1 "MARKETING_VERSION" "$XCODE_PROJECT/project.pbxproj"
      - name: App Store profile
        script: |
          set -euo pipefail
          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --platform IOS --strict-match-identifier --json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          # Profiles that contained a revoked certificate become INVALID: delete them first.
          app-store-connect bundle-ids profiles --bundle-ids "$BID" --type IOS_APP_STORE --state INVALID --json 2>/dev/null \
            | python3 -c "import json,sys; [print(p['id']) for p in json.load(sys.stdin)]" \
            | while read -r pid; do echo "Deleting invalid profile $pid"; app-store-connect profiles delete "$pid"; done || true
          ACTIVE=$(app-store-connect bundle-ids profiles --bundle-ids "$BID" --type IOS_APP_STORE --state ACTIVE --json 2>/dev/null \
            | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" || echo 0)
          if [ "$ACTIVE" = "0" ]; then
            CERT_IDS=$(app-store-connect certificates list --type DISTRIBUTION IOS_DISTRIBUTION --json \
              | python3 -c "import json,sys; print(' '.join(c['id'] for c in json.load(sys.stdin)))")
            app-store-connect profiles create "$BID" --type IOS_APP_STORE --certificate-ids $CERT_IDS --name "ModelLink App Store"
          fi
          app-store-connect bundle-ids profiles --bundle-ids "$BID" --type IOS_APP_STORE --state ACTIVE --save
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" --config Release
          ls -la build/ios/ipa
          unzip -q -o build/ios/ipa/*.ipa -d /tmp/ipa
          codesign -dvv /tmp/ipa/Payload/App.app 2>&1 | grep -E "Authority=Apple Distribution|TeamIdentifier|Identifier=" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" /tmp/ipa/Payload/App.app/Info.plist
    artifacts:
      - modellink/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  # ModelLink: same build, signed IPA as an artifact, no App Store Connect upload (compile/signing check).
  modellink-ios-build:
    name: ModelLink — signed IPA (no upload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: modellink
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      groups:
        - codevia_signing
      ios_signing:
        # Team Apple Distribution identity (see ios-testflight above). The referenced profile
        # belongs to another app; ModelLink's own App Store profile is fetched/created below.
        certificates:
          - monetniy-mir-distribution
        provisioning_profiles:
          - mayor-city-app-store
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: com.neverlandplayworks.modellink
        APP_NAME: ModelLink
        APP_SKU: modellink-ios
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Toolchain
        script: |
          xcodebuild -version
          node --version
          xcode_major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$xcode_major" -lt 26 ]; then echo "Capacitor 8 needs Xcode 26+"; exit 1; fi
      - name: Install dependencies and test
        script: |
          npm ci
          npm run check
      - name: Build web app and sync iOS project
        script: |
          npm run build
          npx cap sync ios
      - name: Set build number
        script: |
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9.]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" "$XCODE_PROJECT/project.pbxproj"
          grep -m1 "CURRENT_PROJECT_VERSION" "$XCODE_PROJECT/project.pbxproj"
          grep -m1 "MARKETING_VERSION" "$XCODE_PROJECT/project.pbxproj"
      - name: App Store profile
        script: |
          set -euo pipefail
          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --platform IOS --strict-match-identifier --json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          # Profiles that contained a revoked certificate become INVALID: delete them first.
          app-store-connect bundle-ids profiles --bundle-ids "$BID" --type IOS_APP_STORE --state INVALID --json 2>/dev/null \
            | python3 -c "import json,sys; [print(p['id']) for p in json.load(sys.stdin)]" \
            | while read -r pid; do echo "Deleting invalid profile $pid"; app-store-connect profiles delete "$pid"; done || true
          ACTIVE=$(app-store-connect bundle-ids profiles --bundle-ids "$BID" --type IOS_APP_STORE --state ACTIVE --json 2>/dev/null \
            | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" || echo 0)
          if [ "$ACTIVE" = "0" ]; then
            CERT_IDS=$(app-store-connect certificates list --type DISTRIBUTION IOS_DISTRIBUTION --json \
              | python3 -c "import json,sys; print(' '.join(c['id'] for c in json.load(sys.stdin)))")
            app-store-connect profiles create "$BID" --type IOS_APP_STORE --certificate-ids $CERT_IDS --name "ModelLink App Store"
          fi
          app-store-connect bundle-ids profiles --bundle-ids "$BID" --type IOS_APP_STORE --state ACTIVE --save
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" --config Release
          ls -la build/ios/ipa
          unzip -q -o build/ios/ipa/*.ipa -d /tmp/ipa
          codesign -dvv /tmp/ipa/Payload/App.app 2>&1 | grep -E "Authority=Apple Distribution|TeamIdentifier|Identifier=" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" /tmp/ipa/Payload/App.app/Info.plist
    artifacts:
      - modellink/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # ModelLink: wait for TestFlight processing, create the internal group, add the account holder.
  modellink-testflight-testers:
    name: ModelLink — TestFlight testers
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: modellink
    integrations:
      app_store_connect: monetniy-mir-asc
    scripts:
      - name: Internal testing
        script: |
          python3 -c "import cryptography" 2>/dev/null || pip3 install --quiet cryptography
          python3 tools/asc_testflight.py com.neverlandplayworks.modellink --timeout-min 50 --notes appstore/testflight.json

  # ModelLink App Store page: texts (ru, en-US), categories, age rating, price, availability, iPhone + iPad
  # screenshots, review notes and the newest processed build (modellink/appstore). Does not submit.
  modellink-app-store-metadata:
    name: ModelLink — App Store page
    instance_type: mac_mini_m2
    max_build_duration: 40
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      groups:
        - review_contact
    scripts:
      - name: Apply metadata
        script: |
          python3 -c "import cryptography" 2>/dev/null || pip3 install --quiet cryptography
          python3 tools/asc_submit.py modellink/appstore/metadata.json

  # Same as above, then sends the version with the newest processed build to App Review.
  modellink-app-store-submit:
    name: ModelLink — submit for App Review
    instance_type: mac_mini_m2
    max_build_duration: 40
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      groups:
        - review_contact
    scripts:
      - name: Apply metadata and submit
        script: |
          python3 -c "import cryptography" 2>/dev/null || pip3 install --quiet cryptography
          python3 tools/asc_submit.py modellink/appstore/metadata.json --submit
