<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; frame-src blob:; media-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ModelLink" />
  <meta name="description" content="Чертежи, 3D-модели, замечания и версии проектов" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/app-icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/app-icon.png" />
  <title>ModelLink — проекты под рукой</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="vendor/jszip.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="boot-screen"><img class="brand-mark-img" src="assets/icons/logo.png" alt="" width="72" height="72"><strong>ModelLink</strong><span>Открываем ваши проекты…</span></div>
  </div>
  <input type="file" id="file-picker" multiple hidden aria-label="Выбрать файлы" />
  <dialog id="modal"><div class="modal-layout"><div class="modal-top"><h2 id="modal-title"></h2><button type="button" class="icon-button" data-action="close-modal" aria-label="Закрыть">×</button></div><div id="modal-content"></div></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
