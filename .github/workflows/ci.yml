name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --trace off
        env:
          E2E_WEBKIT: '1'

  # Proves the native iOS project compiles with the release toolchain, without any Apple credentials.
  ios-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select Xcode
        run: ./scripts/select-xcode.sh
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build iOS app (unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -n 60
      - name: Check the built bundle
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/App.app
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/public/index.html" && test -f "$APP/public/pyodide/pyodide.asm.wasm" && test -f "$APP/public/preview-host.html"
          du -sh "$APP"
