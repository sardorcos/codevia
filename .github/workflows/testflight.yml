name: TestFlight
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  upload:
    needs: test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - run: npm ci
      - name: Write App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY" > ~/private_keys/AuthKey.p8
          chmod 600 ~/private_keys/AuthKey.p8
      - name: Build and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ~/private_keys/AuthKey.p8
          BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.codevia.pocket' }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: ASC_KEY_PATH="$HOME/private_keys/AuthKey.p8" ./scripts/ios-testflight.sh
      - name: Remove key
        if: always()
        run: rm -f ~/private_keys/AuthKey.p8
