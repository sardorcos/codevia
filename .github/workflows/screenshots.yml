name: App Store screenshots
on:
  workflow_dispatch:
    inputs:
      locales:
        description: Comma-separated App Store locales
        default: en-US,ru

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bundled Python packages are required for the matplotlib/pandas screenshots.
      - run: npm run build
        env:
          CODEVIA_PY_STRICT: '1'
      - run: npx playwright install --with-deps chromium
      - name: Fonts for every interface language
        run: sudo apt-get install -y fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji >/dev/null
      - run: node scripts/store-screenshots.mjs "${{ inputs.locales }}"
      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: |
            appstore/screenshots
            appstore/screenshots-ipad
