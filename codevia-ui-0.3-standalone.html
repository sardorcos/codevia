/* Codevia Pocket 0.3 UI preview. Standalone, local-only design build.

const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
const esc = (v = '') => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (name, extra = '') => `<svg class="ico ${extra}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const makeId = () => globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(36).slice(2)}`;
const formatBytes = n => n >= 1024 * 1024 ? `${(n / 1048576).toFixed(1).replace('.', ',')} МБ` : n >= 1024 ? `${(n / 1024).toFixed(1).replace('.', ',')} КБ` : `${n} Б`;
const basename = s => (s || '').split('/').pop();
const extOf = s => (basename(s).split('.').pop() || '').toLowerCase();
const fileKind = s => {
  const ext = extOf(s);
  if (['html','htm'].includes(ext)) return 'html';
  if (['css','scss'].includes(ext)) return 'css';
  if (['js','mjs','jsx','ts','tsx'].includes(ext)) return 'js';
  if (ext === 'php') return 'php';
  if (ext === 'py') return 'py';
  if (ext === 'json') return 'json';
  if (['md','txt','yaml','yml','toml','xml','sh','ini','env','gitignore'].includes(ext)) return 'md';
  return 'other';
};
const bytesOf = v => v instanceof Uint8Array ? v.byteLength : new TextEncoder().encode(String(v)).length;
const isTextFile = filename => ['html','htm','css','scss','js','jsx','mjs','ts','tsx','json','py','php','md','txt','yaml','yml','toml','xml','svg','sh','ini','env','gitignore','csv','sql'].includes(extOf(filename)) || !basename(filename).includes('.');
const normalizePath = source => {
  const raw = String(source || '').replace(/\\/g, '/');
  if (raw.startsWith('/') || /^[a-zA-Z]:/.test(raw)) throw new Error('Недопустимый абсолютный путь');
  const path = raw.replace(/^\.\//,'');
  if (!path || path.includes('\0') || path.split('/').some(x=>x==='..'||!x)) throw new Error('Недопустимый путь файла');
  return path;
};
const fileData = content => ({text:true,content:String(content)});
const fileBinary = bytes => ({text:false,data:bytes});
const getFileText = (p,path) => p?.files?.[path]?.text ? p.files[path].content : null;
const fileLength = f => f.text ? bytesOf(f.content) : f.data.byteLength;
const projectSize = p => Object.values(p.files).reduce((a, f) => a + fileLength(f),0);
const cloneFiles = files => Object.fromEntries(Object.entries(files).map(([k,f])=>[k,f.text?fileData(f.content):fileBinary(new Uint8Array(f.data))]));
const stamp = () => new Date().toISOString();
const fmtDate = s => new Date(s).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const sampleWeb = {
  'index.html':fileData(`<!doctype html>\n<html lang="ru">\n<head>\n  <meta charset="utf-8" />\n  <meta name="viewport" content="width=device-width,initial-scale=1" />\n  <title>Studio portfolio</title>\n  <link rel="stylesheet" href="styles.css" />\n</head>\n<body>\n  <header class="site-header">\n    <strong>studio.</strong>\n    <nav>Главная　 Проекты　 Контакты</nav>\n  </header>\n  <main class="hero">\n    <span class="eyebrow">ДИЗАЙН И РАЗРАБОТКА</span>\n    <h1>Идеи становятся продуктами.</h1>\n    <p>Создаём сайты и приложения.</p>\n    <button class="action" id="contact">Обсудить проект ↗</button>\n    <div class="ribbon"></div>\n  </main>\n  <\x73cript src="app.js"><\/script>\n</body>\n</html>`),
  'styles.css':fileData(`:root { --accent: #40c8f6; }\n* { box-sizing: border-box; }\nbody { margin: 0; font-family: system-ui, sans-serif;\n  background: #f4f9ff; color: #152033; }\n.site-header { display: flex; align-items: center;\n  justify-content: space-between; padding: 22px; }\n.site-header strong { font-size: 21px; letter-spacing: -1px; }\n.site-header nav { font-size: 10px; color: #6a7282; }\n.hero { position: relative; padding: 56px 24px 160px;\n  overflow: hidden; min-height: 590px; }\n.eyebrow { font-size: 11px; color: #60758e;\n  font-weight: bold; letter-spacing: 2px; }\nh1 { font-size: clamp(40px, 10vw, 64px);\n  letter-spacing: -2.5px; line-height: 1.06; }\np { color: #63718a; margin-bottom: 25px; }\n.action { border: 0; background: var(--accent);\n  color: #10202a; border-radius: 12px;\n  font-weight: 700; padding: 15px 20px; }\n.ribbon { position: absolute; width: 130%; height: 190px;\n  transform: rotate(-18deg); bottom: -65px; left: -30px;\n  border-radius: 50%; background: linear-gradient(120deg,\n  transparent 10%, #78ddff 30%, #29b7f9 44%,\n  #b9edff 60%, transparent 80%); filter: blur(3px); }`),
  'app.js':fileData(`document.querySelector('#contact')\n  .addEventListener('click', () => {\n    const btn = document.querySelector('#contact');\n    btn.textContent = 'Спасибо! ✓';\n  });`),
  'data/project.json':fileData(JSON.stringify({name:'Studio portfolio',version:'1.0',theme:'cyan'},null,2)),
  'README.md':fileData('# Studio portfolio\n\nНебольшой демонстрационный проект с HTML, CSS и JavaScript.'),
};
const samplePython = {
  'main.py':fileData(`import json\nfrom calculations import total\n\nwith open('data/orders.json', encoding='utf-8') as f:\n    orders = json.load(f)\n\nprint('Codevia · Python')\nprint('Сумма заказов:', total(orders))`),
  'calculations.py':fileData(`def total(orders):\n    return sum(item['amount'] for item in orders)`),
  'data/orders.json':fileData(JSON.stringify([{amount:2700000},{amount:1650000}],null,2)),

const samplePHP = {
  'index.php':fileData(`<?php\nrequire_once __DIR__ . '/lib/view.php';\n$name = $_GET['name'] ?? 'гость';\necho greeting($name);\n?>`),
  'lib/view.php':fileData(`<?php\nfunction greeting($name) {\n  return '<h1>Привет, ' . htmlspecialchars($name) . '!</h1>';\n}`),
  'styles.css':fileData(`body { font-family: system-ui; padding: 36px; background: #f8fafc; }\nh1 { color: #142b3c; }`),
  'README.md':fileData('# PHP · приветствие\n\nПример PHP-проекта для Codevia 0.2.'),
};
const demoProjects = () => [
  {id:makeId(),name:'Studio portfolio',language:'web',createdAt:stamp(),updatedAt:stamp(),files:cloneFiles(sampleWeb),history:[]},
  {id:makeId(),name:'Python · расчёты',language:'python',createdAt:stamp(),updatedAt:stamp(),files:cloneFiles(samplePython),history:[]},

const S = {projects:[],selectedId:null,route:'home',workspaceView:'files',currentPath:'index.html',openTabs:[],modal:null,density:'compact',editorFont:13,wrapLines:false,fileFilter:'all',search:'',servers:[],serverProtocol:'sftp',dirty:false,lastSave:null,consoleOut:'',consoleKind:'',activePreview:'index.html'};
let db;
let pendingPersist;
let toastTimer;
const DB_NAME='codevia-ui-0-3';
async function openStore(){
 return await new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,1);
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('state'))req.result.createObjectStore('state')};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });
}
async function readStore(){return await new Promise((resolve,reject)=>{const tx=db.transaction('state','readonly'),r=tx.objectStore('state').get('app');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});}
async function writeStore(value){return await new Promise((resolve,reject)=>{const tx=db.transaction('state','readwrite');tx.objectStore('state').put(value,'app');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});}
function serialize(){return {projects:S.projects,selectedId:S.selectedId,servers:S.servers,density:S.density,editorFont:S.editorFont,wrapLines:S.wrapLines};}
function persist(wait=0){clearTimeout(pendingPersist);pendingPersist=setTimeout(async()=>{try{await writeStore(serialize());S.dirty=false;S.lastSave=stamp();const x=$('#save-state');if(x){x.innerHTML=`<span class="status-dot"></span> Сохранено`;x.classList.add('saved')}}catch(e){console.error(e);toast('Не удалось сохранить в памяти устройства')}},wait);}
async function start(){
 try{db=await openStore();const data=await readStore();if(data){Object.assign(S,{projects:data.projects||[],selectedId:data.selectedId||null,servers:data.servers||[],density:data.density||'compact',editorFont:data.editorFont||13,wrapLines:!!data.wrapLines})}else{S.projects=demoProjects();S.selectedId=S.projects[0]?.id;persist()}}
 catch(e){console.error(e);S.projects=demoProjects();S.selectedId=S.projects[0]?.id;toast('Доступ к локальному хранилищу ограничен')}
 S.route='home';render();
}
function project(){return S.projects.find(p=>p.id===S.selectedId) || null}
function currentFile(){return project()?.files?.[S.currentPath]||null}

if(S.route==='home')return `<header class="topbar"><div class="brand">codevia<span>.</span></div><div class="top-actions"><span class="pill" style="margin-right:4px">UI 0.3</span><button class="icon-btn" data-action="settings" aria-label="Настройки">${icon('settings')}</button></div></header>`;
const names={servers:'Серверы',settings:'Настройки',history:'Изменения',diagnostics:'Проверка'};return `<header class="topbar"><button class="icon-btn back-btn" data-action="back" aria-label="Назад">${icon('back')}</button><div class="project-toptitle">${names[S.route]||'Codevia'}</div><div class="top-actions">${S.route==='servers'?`<button class="icon-btn primary-ghost" data-action="add-server" aria-label="Добавить сервер">${icon('plus')}</button>`:''}</div></header>`}
function rail(){const items=[['home','Проекты','grid'],['files','Файлы','folder'],['code','Редактор','code'],['preview','Предпросмотр','eye'],['run','Запуск','terminal'],['servers','Серверы','server']];return `<aside class="rail"><div class="brand">codevia<span>.</span></div>${items.map(([name,label,ic])=>`<button class="rail-link ${S.route==='home'&&name==='home'||S.route==='servers'&&name==='servers'||S.route==='workspace'&&S.workspaceView===name?'active':''}" data-action="nav" data-to="${name}">${icon(ic)} ${label}</button>`).join('')}<div class="rail-note"><span class="pill cyan">LOCAL UI PREVIEW</span><p>Отдельная дизайн-сборка. Python/PHP и серверное соединение требуют модулей основной Codevia.</p></div></aside>`}
function bottomnav(){let items;if(S.route==='workspace')items=[['files','Файлы','folder'],['code','Код','code'],['preview','Просмотр','eye'],['run','Запуск','terminal']];else items=[['home','Проекты','grid'],['code','Код','code'],['run','Запуск','terminal'],['servers','Серверы','server']];return `<nav class="bottomnav" aria-label="Основная навигация">${items.map(([to,label,ic])=>`<button class="nav-item ${to===S.workspaceView&&S.route==='workspace'||S.route===to&&S.route!=='workspace'?'active':''}" data-action="nav" data-to="${to}" aria-label="${label}">${icon(ic)}<span>${label}</span></button>`).join('')}</nav>`}
function render(){document.documentElement.dataset.density=S.density;document.documentElement.style.setProperty('--font-size',S.editorFont+'px');const root=$('#app');root.dataset.density=S.density;let content='';if(S.route==='home')content=renderHome();else if(S.route==='workspace')content=renderWorkspace();else if(S.route==='servers')content=renderServers();else if(S.route==='settings')content=renderSettings();else if(S.route==='history')content=renderHistory();else if(S.route==='diagnostics')content=renderDiagnostics();root.innerHTML=`${rail()}<div class="main-column">${topbar()}${content}${bottomnav()}</div>${S.modal?renderModal():''}`;if(S.route==='workspace'&&S.workspaceView==='preview')refreshPreview();if(S.route==='workspace'&&S.workspaceView==='code')syncCode();}
function renderHome(){const p=project()||S.projects[0];const others=S.projects.filter(x=>x.id!==p?.id);return `<main class="content" id="home-content"><section class="section home-list"><div class="flex between"><div><h1 class="screen-title">Проекты</h1><p class="screen-sub">Всё необходимое под рукой.</p></div><span class="pill green">${icon('check','sm')} На устройстве</span></div><div class="home-actions"><button class="btn primary" data-action="new-project">${icon('plus','sm')} Новый</button><button class="btn secondary" data-action="import-project">${icon('upload','sm')} Импорт</button><button class="btn secondary" data-action="servers">${icon('server','sm')} Серверы</button></div><div class="section-heading"><span>Продолжить работу</span>${p?`<span class="tag-counter">${fmtDate(p.updatedAt)}</span>`:''}</div>${p?`<div class="hero-work"><div class="site-thumb"><strong>codevia.</strong><p>${p.language==='python'?'Расчёты и данные.':p.language==='php'?'PHP-проект.':'Идеи становятся продуктами.'}</p></div><div class="hero-detail"><strong class="truncate">${esc(p.name)}</strong><span class="subtxt">${projectLang(p)} · ${Object.keys(p.files).length} файлов</span><button class="btn primary tiny" data-action="open-project" data-id="${esc(p.id)}">Продолжить ${icon('chevron','sm')}</button></div></div>`:`<div class="empty-state">Проектов пока нет. Начните с нового.</div>`}<div class="section-heading"><span>Все проекты <span class="muted">${S.projects.length}</span></span></div><div class="search-wrap"><input class="text-input search-input" id="project-search" autocomplete="off" placeholder="Поиск проектов" aria-label="Поиск проектов">${icon('search')}</div><div class="project-list" id="project-list">${S.projects.map(p=>`<div class="project-row row-tappable" data-project-name="${esc(p.name.toLowerCase())}" data-action="open-project" data-id="${esc(p.id)}"><div class="file-ext ${p.language==='python'?'py':p.language==='php'?'php':'html'}">${p.language==='python'?'PY':p.language==='php'?'PHP':'</>'}</div><div class="row-main"><span class="row-title">${esc(p.name)}</span><span class="row-description">${projectLang(p)} · ${Object.keys(p.files).length} файлов · ${formatBytes(projectSize(p))}</span></div><span class="muted" style="font-size:11px">${fmtDate(p.updatedAt)}</span>${icon('chevron','sm muted')}</div>`).join('')}</div><div class="form-help" style="margin-top:16px">Файлы хранятся в браузере на этом устройстве. Экспортируйте ZIP для резервной копии.</div></section></main>`}
function renderWorkspace(){if(!project())return `<main class="content"><div class="empty-state">Нет открытого проекта.</div></main>`;if(S.workspaceView==='files')return `<div class="workspace-body">${renderFiles()}</div>`;if(S.workspaceView==='code')return `<div class="workspace-body">${renderEditor()}</div>`;if(S.workspaceView==='preview')return `<div class="workspace-body">${renderPreview()}</div>`;return `<div class="workspace-body">${renderRun()}</div>`}
function fileRow(path,f){const kind=fileKind(path),size=formatBytes(fileLength(f));return `<div class="file-row row-tappable ${path===S.currentPath?'active':''}" data-action="open-file" data-path="${esc(path)}"><span class="file-ext ${kind}">${kind==='html'?'H':kind==='css'?'#':kind==='js'?'JS':kind==='php'?'PHP':kind==='py'?'PY':kind==='json'?'{}':kind==='md'?'MD':icon('file','sm')}</span><div class="row-main"><span class="row-title mono">${esc(basename(path))}</span><span class="row-description">${esc(path.includes('/')?path.substring(0,path.lastIndexOf('/'))+'/':'Корень')} · ${size}</span></div><span class="row-end"><button class="icon-btn row-action" data-action="file-menu" data-path="${esc(path)}" aria-label="Действия с ${esc(path)}">${icon('more','sm')}</button></span></div>`}
function renderFiles(){const p=project(),paths=Object.keys(p.files).sort(),count=paths.length;const visible=paths.filter(path=> S.fileFilter==='all'||S.fileFilter==='code'&&isTextFile(path)||S.fileFilter==='assets'&&!isTextFile(path));return `<div class="compact-toolbar"><div class="search-wrap grow"><input id="file-search" class="text-input search-input" placeholder="Поиск файлов и папок" aria-label="Поиск файлов">${icon('search')}</div><button class="icon-btn" data-action="new-file" aria-label="Создать файл">${icon('plus')}</button></div><div class="compact-toolbar" style="justify-content:space-between"><div class="chips">${[['all','Все'],['code','Код'],['assets','Ресурсы']].map(([id,label])=>`<button data-action="filter-files" data-value="${id}" class="${S.fileFilter===id?'active':''}">${label}</button>`).join('')}</div><button class="btn secondary tiny" data-action="diagnostics">${icon('shield','sm')} Проверка</button></div><div class="file-foot" style="border-top:0;border-bottom:1px solid var(--stroke)"><span class="mono truncate">/${esc(p.name.toLowerCase().replace(/[^a-z\d-]+/gi,'-'))}/</span><span>${count} файлов</span></div><div class="file-list" id="file-list">${visible.map(path=>fileRow(path,p.files[path])).join('')||'<div class="empty-state">Нет файлов</div>'}</div><div class="file-foot"><span>${count} файлов · ${formatBytes(projectSize(p))}</span><span>${statusText()}</span></div>`}
function renderEditor(){const p=project(),paths=Object.keys(p.files).filter(x=>p.files[x].text);if(!p.files[S.currentPath]||!p.files[S.currentPath].text)S.currentPath=paths[0]||'';if(!S.openTabs.includes(S.currentPath))S.openTabs.push(S.currentPath);let f=p.files[S.currentPath];if(!f)return `<div class="empty-state">Создайте текстовый файл</div>`;const editorText=f.content;return `<div class="editor-main"><div class="file-tabs">${S.openTabs.filter(path=>p.files[path]?.text).map(path=>`<button class="file-tab ${path===S.currentPath?'active':''}" data-action="select-tab" data-path="${esc(path)}">${esc(basename(path))}</button>`).join('')}<button class="file-tab" data-action="choose-file" aria-label="Выбрать файл">${icon('plus','sm')}</button></div><div class="editor-topline"><span class="subtxt mono truncate">${esc(S.currentPath)}</span><div class="btn-row" style="flex-wrap:nowrap"><button class="btn ghost tiny" data-action="toggle-wrap" aria-pressed="${S.wrapLines?'true':'false'}" aria-label="Перенос строк">↵ ${S.wrapLines?'Перенос ✓':'Перенос'}</button><button class="icon-btn" data-action="copy-code" aria-label="Копировать код">${icon('copy','sm')}</button></div></div><div class="code-wrap ${S.wrapLines?'wrapped':''}"><div class="line-gutter" id="line-gutter">${Array.from({length:Math.max(1,editorText.split('\n').length)},(_,i)=>i+1).join('\n')}</div><div class="code-area"><pre class="code-highlight" id="code-highlight" aria-hidden="true"></pre><textarea class="code-input" id="code-input" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" wrap="${S.wrapLines?'soft':'off'}" aria-label="Код файла ${esc(S.currentPath)}">${esc(editorText)}</textarea></div></div><div class="editor-status"><span>${esc(extOf(S.currentPath).toUpperCase())} · UTF-8</span><span class="saved flex gap4" id="save-state">${icon('check','sm')} Сохранено</span></div><div class="keybar">${['{ }','< >','[ ]','(',')','/','=',';','Tab'].map(k=>`<button class="key-btn" data-action="key" data-value="${esc(k)}" aria-label="Вставить ${esc(k)}">${esc(k)}</button>`).join('')}<button class="key-btn" data-action="undo" aria-label="Отменить">↶</button><button class="key-btn" data-action="redo" aria-label="Повторить">↷</button></div></div>`}
function renderPreview(){const p=project();const options=Object.keys(p.files).filter(x=>/\.html?$/i.test(x));if(!S.activePreview||!p.files[S.activePreview])S.activePreview=options[0]||'';return `<div class="preview-toolbar"><span class="filename truncate">${icon('file','sm')} ${esc(S.activePreview||'Нет HTML-файлов')}</span><span class="pill green"><span class="status-dot"></span> Локально</span><button class="icon-btn" data-action="refresh-preview" aria-label="Обновить">${icon('refresh')}</button><button class="icon-btn" data-action="open-preview-tab" aria-label="Открыть на весь экран">${icon('expand')}</button></div>${S.activePreview?`<div class="preview-shell"><div class="browser-pane"><iframe id="live-preview" sandbox="allow-scripts" title="Локальный предпросмотр сайта" referrerpolicy="no-referrer"></iframe></div></div><div class="mini-info flex between"><span>Изолированный просмотр · HTML/CSS/JS</span><span>${esc(S.activePreview)}</span></div>`:`<div class="empty-state">Для предпросмотра нужен HTML-файл. Python/PHP выполняются в основной Codevia.</div>`}`}
function renderRun(){const p=project(),isPy=p.language==='python'||extOf(S.currentPath)==='py',isPhp=p.language==='php'||extOf(S.currentPath)==='php',lang=isPy?'python':isPhp?'php':'web';return `<div class="runner"><div class="run-top"><div><div class="detail-header">Выполнение</div><div class="subtxt">${isPy?'Python · Pyodide':isPhp?'PHP · WebAssembly':'HTML / JavaScript · браузер'}</div></div><button class="btn primary" data-action="execute" id="run-action">${icon('play','sm')} Запустить</button></div><div class="run-tools"><span class="runtime-badge ${lang==='python'?'py':lang==='php'?'php':'web'}">${lang==='python'?'PYTHON':lang==='php'?'PHP':'WEB'}</span><span class="subtxt mono truncate">${esc(S.currentPath)}</span><span style="margin-left:auto" class="subtxt">${lang==='web'?'Локально':'Требуется движок'}</span></div><div class="console" id="console-panel">${S.consoleOut||`<span class="command">codevia ~/projects/${esc(p.name.replace(/\s+/g,'-').toLowerCase())} $</span>\n\nЗапуск откроет доступный режим проверки.`}</div>${lang!=='web'?`<div class="callout warn"><strong>${icon('shield','sm')} Примечание о совместимости</strong>Эта отдельная дизайн-сборка не содержит движки Pyodide/PHP.wasm. В основной Codevia 0.2 они работают. Не подменяем выполнение имитацией результата.</div>`:''}<div class="run-bottom"><span class="subtxt">Консоль · без отправки кода на сервер</span><button class="btn secondary tiny" data-action="clear-console">Очистить</button></div></div>`}
function renderServers(){return `<main class="content"><div class="servers-shell"><div class="flex between"><div><h1 class="screen-title">Мои подключения</h1><p class="screen-sub">Редактируйте сайты с телефона.</p></div><button class="btn primary" data-action="add-server">${icon('plus','sm')} Добавить</button></div><div class="notice-band" style="margin-top:13px">${icon('shield','sm')} Профили сохраняются локально. Реальное подключение требует Codevia Bridge.</div><div class="section-heading">Мои подключения <span class="tag-counter">${S.servers.length}</span></div>${S.servers.length?S.servers.map((server,i)=>`<div class="server-row"><div class="server-symbol">${icon('server')}</div><div class="row-main"><strong class="row-title">${esc(server.name)}</strong><span class="row-description mono">${esc(server.protocol.toUpperCase())} · ${esc(server.host)}:${Number(server.port)}</span><span class="row-description mono">${esc(server.path)}</span></div><button class="btn secondary tiny" data-action="inspect-server" data-index="${i}">Открыть</button><button class="icon-btn row-action" data-action="delete-server" data-index="${i}" aria-label="Удалить сервер">${icon('more','sm')}</button></div>`).join(''):`<div class="empty-state">${icon('server','xl')}<div>Нет сохранённых профилей.<br>Добавьте свой сервер.</div></div>`}<div class="section-heading">Доступные протоколы</div><div class="btn-row" style="gap:5px">${['SFTP','SSH','FTPS','FTP'].map(x=>`<span class="pill">${x}</span>`).join('')}</div><div class="form-help" style="margin-top:14px">Пароли и приватные ключи не сохраняются в этом прототипе. Для работы с реальным хостингом используйте Codevia Bridge и проверку ключей/сертификатов.</div></div></main>`}
function renderSettings(){return `<main class="content"><div class="section" style="max-width:750px"><h1 class="screen-title">Интерфейс</h1><p class="screen-sub">Компактность, доступность и редактор.</p><div class="section-heading">Плотность интерфейса</div><div class="segmented"><button class="${S.density==='compact'?'active':''}" data-action="density" data-value="compact">Компактный</button><button class="${S.density==='comfortable'?'active':''}" data-action="density" data-value="comfortable">Комфортный</button></div><div class="section-heading">Редактор кода</div><div class="setting-row"><div class="row-main"><span class="row-title">Размер шрифта</span><span class="row-description">${S.editorFont} px · меняется сразу</span></div><input type="range" min="12" max="18" step="1" value="${S.editorFont}" id="font-range" class="range-input" style="width:120px" aria-label="Размер шрифта кода"></div><div class="setting-row"><div class="row-main"><span class="row-title">Тёмная тема</span><span class="row-description">Контрастная и удобная для кода</span></div><span class="pill green">Включена</span></div><div class="section-heading">Хранение</div><div class="setting-row"><div class="row-main"><span class="row-title">Проекты на устройстве</span><span class="row-description">${S.projects.length} проектов · ${formatBytes(S.projects.reduce((a,p)=>a+projectSize(p),0))}</span></div>${icon('shield','lg')}</div><div class="form-help" style="margin-top:14px">Внешний вид сохраняется в локальном хранилище браузера. Изменения дизайна не требуют доступа к вашему серверу.</div></div></main>`}
function renderHistory(){const p=project();if(!p)return '<main class="content"><div class="empty-state">Нет проекта</div></main>';return `<main class="content"><div class="section" style="max-width:850px"><div class="flex between"><div><h1 class="screen-title">Изменения</h1><p class="screen-sub">${esc(p.name)} · контрольные точки</p></div><button class="btn primary" data-action="checkpoint">${icon('save','sm')} Сохранить версию</button></div><div class="section-heading">Сохранённые версии <span class="tag-counter">${p.history?.length||0}</span></div>${p.history?.length?p.history.slice().reverse().map((snap,i)=>`<div class="file-row"><div class="project-glyph">${icon('clock')}</div><div class="row-main"><span class="row-title">${esc(snap.label)}</span><span class="row-description">${fmtDate(snap.at)} · ${Object.keys(snap.files).length} файлов</span></div><button class="btn secondary tiny" data-action="restore-version" data-rev="${esc(snap.id)}">Восстановить</button></div>`).join(''):`<div class="empty-state">Пока нет контрольных точек. Сохраните первую версию проекта.</div>`}<div class="callout"><strong>Как работает история</strong>Версии создаются вручную и хранятся вместе с проектом на этом устройстве. Восстановление перезаписывает текущие локальные файлы, но перед ним создаётся контрольная точка текущего состояния.</div></div></main>`}
function scanProject(p){const issues=[];const textPaths=Object.keys(p.files).filter(path=>p.files[path].text);const resolve=(base,rel)=>{try{const parts=base.split('/').slice(0,-1);for(const seg of rel.split('/')){if(!seg||seg==='.')continue;if(seg==='..')parts.pop();else parts.push(seg)}return parts.join('/')}catch{return ''}};for(const path of textPaths){const content=p.files[path].content;const ext=extOf(path);if(ext==='json'){try{JSON.parse(content)}catch(e){issues.push({type:'error',title:'Некорректный JSON',details:`${path}: ${e.message}`})}}if(['html','htm','css'].includes(ext)){const refs=[];const re=ext==='css'?/url\(\s*['"]?([^'"\)]+)['"]?\s*\)/gi:/(?:src|href)\s*=\s*['"]([^'"]+)['"]/gi;for(let m;(m=re.exec(content));){let v=m[1].trim();if(!v||/^(#|https?:|data:|blob:|mailto:|javascript:|\/\/)/i.test(v))continue;v=v.split(/[?#]/)[0];if(!v)continue;refs.push(v)}for(const ref of refs){const found=resolve(path,ref);if(!p.files[found])issues.push({type:'error',title:'Не найден локальный ресурс',details:`${path} → ${ref}`})}}}return issues}
function renderDiagnostics(){const p=project();if(!p)return '<main class="content"><div class="empty-state">Нет проекта</div></main>';const issues=scanProject(p);return `<main class="content"><div class="section" style="max-width:800px"><div class="flex between"><div><h1 class="screen-title">Проверка</h1><p class="screen-sub">Ссылки на ресурсы и JSON.</p></div><button class="btn secondary" data-action="refresh-diagnostics">${icon('refresh','sm')} Повторить</button></div><div class="compact-stats"><div><strong>${Object.keys(p.files).length}</strong> файлов</div><div><strong style="color:${issues.length?'var(--danger)':'var(--success)'}">${issues.length}</strong> замечаний</div><div><strong>${formatBytes(projectSize(p))}</strong> размер</div></div>${issues.length?issues.map(x=>`<div class="check-result"><span style="color:var(--danger)">${icon('shield')}</span><div><div class="type">${esc(x.title)}</div><p class="mono">${esc(x.details)}</p></div></div>`).join(''):`<div class="check-result"><span style="color:var(--success)">${icon('check')}</span><div><div class="type">Обнаруженных ошибок нет</div><p>Проверены ссылки в HTML/CSS и синтаксис JSON. Это не полное тестирование работы сайта.</p></div></div>`}<div class="btn-row" style="margin-top:22px"><button class="btn primary" data-action="export-report">${icon('download','sm')} Скачать отчёт</button><button class="btn secondary" data-action="nav" data-to="code">Открыть код</button></div></div></main>`}
function renderModal(){const m=S.modal;let title='',body='';const p=project();if(m.type==='new-project'){title='Новый проект';body=`<div class="field"><label class="field-label" for="new-project-name">Название</label><input class="text-input" id="new-project-name" placeholder="Новый проект" maxlength="80"></div><div class="field"><span class="field-label">Шаблон проекта</span><div class="segmented"><button data-action="template" data-value="web" class="${m.template==='web'?'active':''}">Сайт</button><button data-action="template" data-value="python" class="${m.template==='python'?'active':''}">Python</button><button data-action="template" data-value="php" class="${m.template==='php'?'active':''}">PHP</button><button data-action="template" data-value="empty" class="${m.template==='empty'?'active':''}">Пустой</button></div></div><button class="btn primary full" data-action="confirm-new-project">Создать проект ${icon('chevron','sm')}</button>`}
else if(m.type==='new-file'){title='Создать файл';body=`<div class="field"><label class="field-label" for="new-file-path">Путь и имя файла</label><input class="text-input mono" id="new-file-path" placeholder="src/components/Header.jsx"></div><div class="form-help">Папки создаются автоматически. Нельзя использовать «..» и абсолютные пути.</div><button class="btn primary full" data-action="confirm-new-file">${icon('plus','sm')} Добавить файл</button>`}
else if(m.type==='project-menu'){title='Действия проекта';body=`<div class="stack" style="gap:7px"><button class="btn secondary full" data-action="checkpoint">${icon('save','sm')} Сохранить версию</button><button class="btn secondary full" data-action="export-project">${icon('download','sm')} Экспорт ZIP</button><button class="btn secondary full" data-action="diagnostics">${icon('shield','sm')} Проверка файлов</button><button class="btn secondary full" data-action="rename-project">${icon('edit','sm')} Переименовать проект</button></div>`}

case 'delete-server':if(confirm('Удалить профиль подключения с этого устройства?')){S.servers.splice(Number(el.dataset.index),1);persist();render()}break;
case 'remove-server':S.servers.splice(S.modal.index,1);S.modal=null;persist();render();toast('Профиль удалён');break;
case 'execute':{const p=project();if(p?.language==='web'){setRoute('workspace','preview');toast('Открыт HTML-предпросмотр')}else{const panel=$('#console-panel');if(panel){panel.textContent=`Codevia UI 0.3 · ${p.language.toUpperCase()}\n\nЛокальный движок не встроен в этот автономный UI-пакет.\nИспользуйте Python/PHP в основной Codevia Pocket 0.2.\nНикакого кода отправлено или выполнено не было.`}toast('Запуск требует модуля основной Codevia')}break}
case 'clear-console':S.consoleOut='';const panel=$('#console-panel');if(panel)panel.textContent='Консоль очищена.';break;
case 'open-backend-note':toast('Для реальных серверных подключений нужен Codevia Bridge');break;
}}
document.addEventListener('click',e=>{try{handleAction(e)}catch(err){console.error(err);toast(err.message||'Ошибка интерфейса')}});
document.addEventListener('input',e=>{if(e.target.id==='code-input')updateEditor();else if(e.target.id==='project-search'){$$('.project-row').forEach(node=>node.classList.toggle('hidden',!node.dataset.projectName.includes(e.target.value.trim().toLowerCase())))}else if(e.target.id==='file-search'){$$('.file-list .file-row').forEach(node=>node.classList.toggle('hidden',!node.textContent.toLowerCase().includes(e.target.value.trim().toLowerCase())))}else if(e.target.id==='font-range'){S.editorFont=Number(e.target.value);document.documentElement.style.setProperty('--font-size',S.editorFont+'px');persist(200)}});
document.addEventListener('scroll',e=>{if(e.target.id==='code-input')scrollEditor()},true);
document.addEventListener('keydown',e=>{if(e.target.id==='code-input'){if(e.key==='Tab'){e.preventDefault();insertAtCursor('  ')}else if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();persist(0);toast('Сохранено локально')}}else if(e.key==='Escape'&&S.modal){S.modal=null;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='server-form')return;e.preventDefault();const get=k=>$('#server-'+k).value.trim();const port=Number(get('port'));if(!get('host')||!/^[a-z0-9.-]+$/i.test(get('host'))||!get('user')||!Number.isInteger(port)||port<1||port>65535){toast('Проверьте адрес, пользователя и порт');return}S.servers.push({id:makeId(),name:get('name')||get('host'),host:get('host'),user:get('user'),port,protocol:S.serverProtocol,path:get('path')||'/'});S.modal=null;persist();render();toast('Параметры профиля сохранены, без паролей')});
start();

</script>
</body>
</html>
